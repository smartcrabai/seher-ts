name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: publish-to-npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@11.17.0

      - name: Verify tag matches package.json version
        run: |
          version=$(jq -r .version package.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun test

      # bun pm pack resolves workspace: protocol dependencies; npm publish cannot
      - name: Pack packages
        run: |
          mkdir -p artifacts
          (cd packages/sdk && bun pm pack --destination "${GITHUB_WORKSPACE}/artifacts" --quiet)
          (cd packages/cli && bun pm pack --destination "${GITHUB_WORKSPACE}/artifacts" --quiet)

      # Guard against unresolved workspace: deps or stale versions in tarballs
      # (see https://github.com/oven-sh/bun/issues/20477)
      - name: Verify packed tarballs
        run: |
          version=$(jq -r .version package.json)
          for tgz in artifacts/*.tgz; do
            manifest=$(tar -xzOf "${tgz}" package/package.json)
            if echo "${manifest}" | grep -q '"workspace:'; then
              echo "Unresolved workspace: protocol in ${tgz}" >&2
              exit 1
            fi
            packed=$(echo "${manifest}" | jq -r .version)
            if [ "${packed}" != "${version}" ]; then
              echo "Version mismatch in ${tgz}: ${packed} != ${version}" >&2
              exit 1
            fi
          done

      - name: Publish @seher-ts/sdk
        run: npm publish "$(ls artifacts/seher-ts-sdk-*.tgz)" --provenance --access public

      - name: Publish @seher-ts/cli
        run: npm publish "$(ls artifacts/seher-ts-cli-*.tgz)" --provenance --access public
