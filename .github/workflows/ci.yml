name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: bun install

      - name: Build packages
        shell: bash
        run: bun run build

      - name: Run tests
        shell: bash
        run: bun test

      - name: Run lint
        shell: bash
        run: bun run lint


