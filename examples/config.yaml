# yaml-language-server: $schema=https://raw.githubusercontent.com/smartcrabai/seher-ts/main/packages/cli/schemas/config.schema.json

# Top-level skills is the default for all providers.
# Writing `skills:` on an individual provider overrides it as a whole block.
skills:
  includeClaude: true

# Top-level retry is also the default for all providers. Transient HTTP errors
# (`HTTP 429 / 500 / 502 / 503 / 504`) are retried against the same provider
# with exponential backoff, and if it still doesn't recover, switch to the
# next provider via the LimitError path. When `retry:` is defined on a
# provider, the root value is fully replaced as a block (no field-level merge).
retry:
  enabled: true
  maxAttempts: 5
  initialDelaySecs: 2
  maxDelaySecs: 60
  multiplier: 2.0
  retryClientErrors: false  # set to true to also retry HTTP 401/404

# Top-level env vars are applied to every provider; provider-level `env`
# entries override these on a per-key basis (see `env` under `zai` below).
env:
  HTTP_PROXY: http://corp-proxy:8080


providers:
  codex:
    models:
      plan: { model: gpt-5.5, priority: 5 }
      build: { model: gpt-5.5, priority: 4 }

  claude:
    priority: 3
    # Provider-level reasoning effort default (overridden by a model entry's
    # own `effort`; a root-level `effort:` would be the final fallback).
    effort: medium
    models:
      plan: opus-4.7
      build: sonnet-4.6
      low: haiku-4.5
      # Model-level `effort` overrides the provider-level default above.
      high: { model: opus-4.7, effort: xhigh }
      # A `:level` suffix on the model id is only used when no `effort` is
      # resolved at the model/provider/root level.
      fast: opus-4.7:low

  zai:
    sdk: claude
    api:
      key: sk-za-xxxxxxxxxxxxx
      endpoint: https://api.zai.example.com
    # Providers that don't want to load Claude skills themselves opt out here.
    skills:
      includeClaude: false
    # zai-specific retry settings (overrides the root retry as a whole block).
    retry:
      enabled: true
      maxAttempts: 3
      initialDelaySecs: 1
      maxDelaySecs: 10
      multiplier: 2.0
    # Provider-level env vars merge over the root `env` above per-key: zai
    # keeps HTTP_PROXY from the root but overrides NO_PROXY for itself.
    env:
      NO_PROXY: internal.zai.example.com
    models:
      plan: glm-5.1
      build: glm-5.1

  # Use `sdk: pi` with any provider key to drive the pi.dev agent.
  # There is no default provider mapping — `sdk: pi` is required.
  # `api` is optional: without it, pi resolves auth from its own config.
  my-pi:
    sdk: pi
    models:
      build: anthropic/claude-sonnet-4-5

  # `provider` overrides the YAML map key as the resolved provider name.
  # Two entries with `provider: claude` share the same CodexBar usage pool.
  claude-fallback:
    provider: claude
    priority: 1
    models:
      build: sonnet-4.6
