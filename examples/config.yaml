# yaml-language-server: $schema=https://raw.githubusercontent.com/smartcrabai/seher-ts/main/packages/cli/schemas/config.schema.json

providers:
  codex:
    models:
      plan: { model: gpt-5.5, priority: 5 }
      build: { model: gpt-5.5, priority: 4 }

  claude:
    priority: 3
    models:
      plan: opus-4.7
      build: sonnet-4.6
      low: haiku-4.5

  zai:
    sdk: claude
    api:
      key: sk-za-xxxxxxxxxxxxx
      endpoint: https://api.zai.example.com
    models:
      plan: glm-5.1
      build: glm-5.1

  # `provider` overrides the YAML map key as the resolved provider name.
  # Two entries with `provider: claude` share the same CodexBar usage pool.
  claude-fallback:
    provider: claude
    priority: 1
    models:
      build: sonnet-4.6
