# yaml-language-server: $schema=https://raw.githubusercontent.com/smartcrabai/seher-ts/main/packages/cli/schemas/config.schema.json

# トップレベルの skills は全 provider のデフォルト。
# 個別 provider で `skills:` を書くとブロック単位で上書きされる。
skills:
  includeClaude: true

# トップレベルの retry も全 provider のデフォルト。
# provider 側で `retry:` が定義されると root の値は丸ごと置き換えられる。
retry:
  enabled: true
  maxAttempts: 5
  initialDelaySecs: 2
  maxDelaySecs: 60
  multiplier: 2.0
  retryClientErrors: false

providers:
  codex:
    models:
      plan: { model: gpt-5.5, priority: 5 }
      build: { model: gpt-5.5, priority: 4 }

  claude:
    priority: 3
    models:
      plan: opus-4.7
      build: sonnet-4.6
      low: haiku-4.5

  zai:
    sdk: claude
    api:
      key: sk-za-xxxxxxxxxxxxx
      endpoint: https://api.zai.example.com
    # 自前で Claude スキルを読みたくない provider はここで opt out。
    skills:
      includeClaude: false
    # zai 専用のリトライ設定 (root の retry をブロック単位で上書き)。
    retry:
      enabled: true
      maxAttempts: 3
      initialDelaySecs: 1
    models:
      plan: glm-5.1
      build: glm-5.1

  # Use `sdk: pi` with any provider key to drive the pi.dev agent.
  # There is no default provider mapping — `sdk: pi` is required.
  my-pi:
    sdk: pi
    api:
      key: sk-xxxxxxxxxxxxx
      endpoint: https://api.example.com
    models:
      build: anthropic/claude-sonnet-4-5

  # `provider` overrides the YAML map key as the resolved provider name.
  # Two entries with `provider: claude` share the same CodexBar usage pool.
  claude-fallback:
    provider: claude
    priority: 1
    models:
      build: sonnet-4.6
